<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub Pro - Debug Version</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#1a1a3e;color:#fff;min-height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .container{border:3px solid #00d4ff;padding:20px;background:#16213e;border-radius:10px;width:90%;max-width:700px}
        .title{color:#00d4ff;font-size:2em;margin-bottom:10px}
        .status{color:#888;font-size:14px;margin-bottom:20px}
        .error{color:#ff6b81;margin:10px 0;padding:10px;background:#33000033;border:1px solid #ff4757;border-radius:5px}
        .success{color:#7bed9f;margin:10px 0;padding:10px;background:#00330033;border:1px solid #2ed573;border-radius:5px}
    </style>
</head>
<body>
    <div class="container">
        <div class="title">StreamHub Pro Debug</div>
        <div class="status" id="status">Checking loading status...</div>
        <div id="errorBox" class="error"></div>
        <div id="successBox" class="success"></div>
    </div>
    
    <script>
    // ===== DEBUG VERSION =====
    
    // Status tracking
    var statusDiv = $('#status');
    var errorBox = $('#errorBox');
    var successBox = $('#successBox');
    
    function $(id){var el=document.getElementById(id);return el}
    
    // Report status
    function setStatus(msg, success){
        if(statusDiv){statusDiv.innerHTML = msg; statusDiv.className = success ? 'status success' : 'status error'}
    }
    
    function showError(msg){if(errorBox){errorBox.innerHTML='<strong>Error:</strong> '+msg;errorBox.style.display='block'}}
    function showSuccess(msg){if(successBox){successBox.innerHTML='<strong>Success:</strong> '+msg;successBox.style.display='block'}}
    
    // Initialize
    setStatus('Initializing StreamHub Pro...');
    
    // Check if we're in file:// or http:// environment
    var protocol = window.location.protocol;
    setStatus('Protocol: ' + protocol, protocol !== 'file:');
    
    // Simple DOM check
    var appDiv = $('app');
    if(appDiv){
        setStatus('Found #app element', true);
        appDiv.style.border = '2px solid #00d4ff';
        appDiv.style.background = '#0a0a1a';
    } else {
        setStatus('ERROR: #app element NOT found', false);
        showError('Critical: Cannot find element with id="app" in the HTML');
    }
    
    // Try to show login screen
    setTimeout(function(){
        var loginScreen = $('#loginScreen');
        if(loginScreen){
            setStatus('Found #loginScreen element', true);
            loginScreen.style.display = 'block';
        } else {
            setStatus('WARNING: #loginScreen NOT found', false);
        }
    }, 500);
    
    setStatus('Debug complete - check above messages', true);
    </script>
</body>
</html>
