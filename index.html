<!DOCTYPE html>
<html lang="en">

    <title>StreamHub Pro - IPTV Player</title>

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);color:#fff;min-height:100vh}
        .screen{display:none;min-height:100vh}.screen.active{display:flex;flex-direction:column}
